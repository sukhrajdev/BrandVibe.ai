<!DOCTYPE html>
<html lang="en" class="dark" style="scroll-behavior: smooth;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrandVibe.ai - AI Reputation Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* CRITICAL: Set background immediately to prevent white flash on load */
      html, body {
        background-color: #020617; /* slate-950 */
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', sans-serif;
        color: white;
        overflow-x: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #020617;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
      
      /* Speech Bubble Tail Utility */
      .speech-tail::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 20%;
        border-width: 15px 15px 0;
        border-style: solid;
        border-color: #ffffff transparent;
        display: block;
        width: 0;
      }
      
      /* Reverse Tail for right aligned */
      .speech-tail-right::after {
        left: auto;
        right: 20%;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                950: '#020617',
              },
              primary: {
                500: '#a855f7', // Purple
                400: '#c084fc',
              },
              secondary: {
                500: '#06b6d4', // Cyan
                400: '#22d3ee',
              }
            },
            animation: {
              'bounce-slow': 'bounce-slow 6s infinite ease-in-out',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              'bounce-slow': {
                '0%, 100%': { transform: 'translateY(-2%) rotateX(2deg)' },
                '50%': { transform: 'translateY(2%) rotateX(-1deg)' },
              }
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "framer-motion": "https://esm.sh/framer-motion@^12.25.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
